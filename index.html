<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>十二面骰子 · 十二地支</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #f5f2ee 0%, #e8e0d4 100%);
    font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(0,0,0,.08), transparent),
      radial-gradient(1px 1px at 30% 60%, rgba(0,0,0,.05), transparent),
      radial-gradient(1px 1px at 55% 10%, rgba(0,0,0,.06), transparent),
      radial-gradient(1px 1px at 70% 80%, rgba(0,0,0,.04), transparent),
      radial-gradient(1.5px 1.5px at 20% 90%, rgba(0,0,0,.08), transparent),
      radial-gradient(1.5px 1.5px at 85% 30%, rgba(0,0,0,.06), transparent),
      radial-gradient(1px 1px at 45% 45%, rgba(0,0,0,.05), transparent),
      radial-gradient(1px 1px at 90% 55%, rgba(0,0,0,.07), transparent);
    pointer-events: none; z-index: 0;
  }
  .title {
    position: fixed; top: 6%; left: 50%; transform: translateX(-50%);
    z-index: 2; color: #5a4a3a; font-size: 28px; font-weight: bold;
    letter-spacing: 8px; text-shadow: 0 2px 8px rgba(0,0,0,.08);
    text-align: center;
  }
  .title small {
    display: block; font-size: 14px; font-weight: normal; letter-spacing: 2px;
    opacity: .55; margin-top: 4px;
  }
  .btn-area {
    position: fixed; bottom: 7%; left: 50%; transform: translateX(-50%);
    z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .shake-btn {
    padding: 14px 56px; font-size: 22px; font-weight: bold; color: #fff;
    background: linear-gradient(135deg, #5a4a3a, #7a6a5a);
    border: none; border-radius: 8px; cursor: pointer;
    letter-spacing: 6px; transition: all .25s;
    box-shadow: 0 4px 24px rgba(0,0,0,.12); position: relative; overflow: hidden;
  }
  .shake-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.08));
    pointer-events: none;
  }
  .shake-btn:hover {
    background: linear-gradient(135deg, #6a5a4a, #8a7a6a);
    box-shadow: 0 4px 36px rgba(0,0,0,.2);
    transform: translateY(-2px);
  }
  .shake-btn:active { transform: translateY(0); }
  .shake-btn:disabled {
    opacity: .5; cursor: not-allowed; transform: none !important; box-shadow: none;
  }
  .result-box {
    display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px;
  }
  .result-label { color: rgba(0,0,0,.35); font-size: 15px; letter-spacing: 2px; }
  .result-char {
    font-size: 34px; font-weight: bold; color: #5a4a3a;
    text-shadow: none; opacity: 0; transition: opacity .4s;
  }
  .result-char.show { opacity: 1; animation: popIn .45s ease-out; }
  .result-info {
    font-size: 13px; color: rgba(90,74,58,.55); letter-spacing: 1px;
    opacity: 0; transition: opacity .4s .12s; align-self: center;
    white-space: nowrap;
  }
  .result-info.show { opacity: 1; }
  @keyframes popIn {
    0%   { transform: scale(0); opacity: 0; }
    60%  { transform: scale(1.25); }
    100% { transform: scale(1); opacity: 1; }
  }
  canvas { display: block; }
</style>
</head>
<body>

<div class="title">
  十二面骰子
  <small>⚡ 点击摇一摇 · 卜问天机 ⚡</small>
</div>

<div class="btn-area">
  <button class="shake-btn" id="shakeBtn">摇一摇</button>
  <div class="result-box">
    <span class="result-label">☰ 卜得：</span>
    <span class="result-char" id="resultChar"></span>
    <span class="result-info" id="resultInfo"></span>
  </div>
</div>

<script type="importmap">{
  "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" }
}</script>
<script type="module">
import * as THREE from 'three';

// ── 需求数据：数字 → 地支 / 五行 / 三合局（来源：需求.md 对应表）──
// 六冲对（相对面，和=13）：1↔12 子午｜2↔11 巳亥｜3↔10 丑未｜4↔9 辰戌｜5↔8 寅申｜6↔7 卯酉
const FACE_SPEC = {
  1:  { branch: '子', wuxing: '水', sanhe: '水' },
  2:  { branch: '巳', wuxing: '火', sanhe: '金' },
  3:  { branch: '未', wuxing: '土', sanhe: '木' },
  4:  { branch: '戌', wuxing: '土', sanhe: '火' },
  5:  { branch: '寅', wuxing: '木', sanhe: '火' },
  6:  { branch: '卯', wuxing: '木', sanhe: '木' },
  7:  { branch: '酉', wuxing: '金', sanhe: '金' },
  8:  { branch: '申', wuxing: '金', sanhe: '水' },
  9:  { branch: '辰', wuxing: '土', sanhe: '水' },
  10: { branch: '丑', wuxing: '土', sanhe: '金' },
  11: { branch: '亥', wuxing: '水', sanhe: '木' },
  12: { branch: '午', wuxing: '火', sanhe: '火' },
};

// 五行配色：fill=面底色，text=文字色（依底色明度取强对比色）
const WUXING = {
  木: { fill: '#2e8b57', text: '#ffffff' }, // 青绿
  火: { fill: '#c0392b', text: '#ffffff' }, // 朱红
  土: { fill: '#cf9f2e', text: '#3a2a00' }, // 土黄
  金: { fill: '#c4c8ce', text: '#3a3a3a' }, // 银白
  水: { fill: '#1f3a5f', text: '#ffffff' }, // 深蓝
};

// 三合局配色：同三合局三面共用描边色，作视觉串联
const SANHE = {
  水: { border: '#1e90ff', name: '申子辰·水' }, // 亮蓝
  火: { border: '#ff4d3d', name: '寅午戌·火' }, // 亮红
  木: { border: '#3ccf5e', name: '亥卯未·木' }, // 亮绿
  金: { border: '#e6c34a', name: '巳酉丑·金' }, // 亮金
};

// ── 场景 ──
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f5f2ee');

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 20);
camera.position.set(0, 0, 4.5);
camera.lookAt(0, 0, 0);
updateCamera();

// 根据屏幕比例自适应相机距离，确保骰子不超出视野
function updateCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  // visibleWidth = 2 * z * tan(fov/2) * aspect，需 ≥ DICE_RADIUS * 2.8
  const minZ = (1 * 2.8) / (2 * Math.tan(40 * Math.PI / 360) * Math.max(aspect, 0.35));
  camera.position.z = Math.max(4.5, minZ);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

// ── 灯光（提亮环境光，保证深色五行面清晰可辨）──
const ambient = new THREE.AmbientLight(0xffffff, 0.95);
scene.add(ambient);
const mainLight = new THREE.DirectionalLight(0xffffff, 0.55);
mainLight.position.set(4, 6, 5);
scene.add(mainLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-3, 1, -2);
scene.add(fillLight);

// ── 背景纹理 ──
const dotsGeo = new THREE.BufferGeometry();
const dotCount = 80;
const dotPos = new Float32Array(dotCount * 3);
for (let i = 0; i < dotCount * 3; i++) dotPos[i] = (Math.random() - 0.5) * 50;
dotsGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
const dotMat = new THREE.PointsMaterial({ color: 0x000000, size: 0.015, transparent: true, opacity: 0.04 });
scene.add(new THREE.Points(dotsGeo, dotMat));

// ── 十二面体 ──
const DICE_RADIUS = 1;
const geo = new THREE.DodecahedronGeometry(DICE_RADIUS, 0);
const pos = geo.attributes.position;

// 提取 12 面中心 + 法线
// 注意：DodecahedronGeometry 每个五边形按"扇形"从同一顶点三角化，
// 每组 9 个顶点里第 0/3/6 号是同一个角顶点，直接取样会得到角而非面心。
// 因此需先对该面 9 个顶点去重，取 5 个独立顶点的均值 = 真正的面心。
const faceCenters = [];
const faceNormals = [];
for (let i = 0; i < pos.count; i += 9) {
  const verts = [];
  for (let j = 0; j < 9; j++) {
    const v = new THREE.Vector3(pos.getX(i + j), pos.getY(i + j), pos.getZ(i + j));
    if (!verts.some(u => u.distanceTo(v) < 1e-4)) verts.push(v);
  }
  const center = new THREE.Vector3();
  verts.forEach(v => center.add(v));
  center.multiplyScalar(1 / verts.length);
  faceCenters.push(center);
  faceNormals.push(center.clone().normalize());  // 正十二面体以原点为心，面心方向即面法线
}

// 每个面的"朝上"方向（面内指向第一个顶点的方向，投影到面平面）
const faceUpDir = [];
for (let f = 0; f < 12; f++) {
  const v = new THREE.Vector3(pos.getX(f*9), pos.getY(f*9), pos.getZ(f*9));
  const toVert = v.clone().sub(faceCenters[f]);
  const proj = toVert.clone().sub(faceNormals[f].clone().multiplyScalar(toVert.dot(faceNormals[f])));
  faceUpDir.push(proj.normalize());
}

// ── 物理面 → 数字(逻辑面)映射：保证「相对面 = 六冲、数字和 = 13」──
// 正十二面体天然有 6 对相对面，恰好对应 6 对六冲。算法：
//  ① 取最朝相机的面(+Z) 为「子(1)」，其对面为「午(12)」——满足子午冲与尊位。
//  ② 子面的 5 个邻居构成「南环」，按绕轴角度排序后赋号 [8,9,10,11,6]；
//     其各自对面(北环) 自动得到 13-该号，即六冲对，和恒为 13。
//  ③ 南环顺序选 [8,9,10,11,6]，使水局{1,8,9}与对面火局{12,5,4}各自相邻聚集。
const opp = [];                       // opp[i] = 面 i 的对面（法线点积最接近 -1）
for (let i = 0; i < 12; i++) {
  let bj = -1, bd = 2;
  for (let j = 0; j < 12; j++) {
    if (j === i) continue;
    const d = faceNormals[i].dot(faceNormals[j]);
    if (d < bd) { bd = d; bj = j; }
  }
  opp[i] = bj;
}
const faceVerts = [];                 // 每个面的 5 个独立顶点（去重）
for (let f = 0; f < 12; f++) {
  const vs = [];
  for (let j = 0; j < 9; j++) {
    const v = new THREE.Vector3(pos.getX(f*9+j), pos.getY(f*9+j), pos.getZ(f*9+j));
    if (!vs.some(u => u.distanceTo(v) < 1e-4)) vs.push(v);
  }
  faceVerts.push(vs);
}
const adjacent = (a, b) => {          // 共享 ≥2 顶点 = 共边相邻
  let s = 0;
  for (const va of faceVerts[a]) for (const vb of faceVerts[b]) if (va.distanceTo(vb) < 1e-4) s++;
  return s >= 2;
};
const neighbors = a => {
  const r = [];
  for (let j = 0; j < 12; j++) if (j !== a && adjacent(a, j)) r.push(j);
  return r;
};

const numForFace = new Array(12).fill(0);
// 子(1) = 最朝 +Z 的面；午(12) = 其对面
let face1 = 0, bestZ = -2;
for (let i = 0; i < 12; i++) if (faceNormals[i].z > bestZ) { bestZ = faceNormals[i].z; face1 = i; }
numForFace[face1] = 1;
numForFace[opp[face1]] = 12;
// 南环（子面 5 邻居）按绕轴角度排序后赋号，对面自动成六冲
const southRing = neighbors(face1);
{
  const axis = faceNormals[face1];
  const upRef = Math.abs(axis.y) < 0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
  const tx = new THREE.Vector3().crossVectors(axis, upRef).normalize();
  const ty = new THREE.Vector3().crossVectors(axis, tx).normalize();
  southRing.sort((a, b) => {
    const ra = faceCenters[a].clone().sub(faceCenters[face1]);
    const rb = faceCenters[b].clone().sub(faceCenters[face1]);
    return Math.atan2(ra.dot(ty), ra.dot(tx)) - Math.atan2(rb.dot(ty), rb.dot(tx));
  });
}
const southNums = [8, 9, 10, 11, 6];  // 顺序保证水/火局相邻聚集
southRing.forEach((ph, k) => {
  numForFace[ph] = southNums[k];
  numForFace[opp[ph]] = 13 - southNums[k];
});

// 完全约束的对齐四元数：法线→+Z，朝上→+Y
function alignQuat(faceIdx) {
  const z = faceNormals[faceIdx];   // 面法线
  const y = faceUpDir[faceIdx];     // 面朝上方向（切向）
  const x = new THREE.Vector3().crossVectors(y, z).normalize();  // 面右方向
  // 矩阵列 = [x, y, z] => 将 (0,0,1) → z (faceNormal)
  // 取其逆 => faceNormal → (0,0,1), faceUp → (0,1,0)
  const m = new THREE.Matrix4().set(
    x.x, y.x, z.x, 0,
    x.y, y.y, z.y, 0,
    x.z, y.z, z.z, 0,
    0, 0, 0, 1
  );
  const q = new THREE.Quaternion().setFromRotationMatrix(m);
  return q.invert();
}

// 纹理生成：同面双标（数字主 + 地支辅）+ 五行底色 + 三合描边
function createTexture({ num, branch, wuxing, sanhe }) {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2, r = size * 0.45;
  const lightText = wuxing.text === '#ffffff';

  // 整块画布填五行底色 —— UV 边缘即使偏移也不露色
  ctx.fillStyle = wuxing.fill;
  ctx.fillRect(0, 0, size, size);

  // 五边形区域（与 UV 映射同构，尖朝上）
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / 5;
    const px = cx + r * Math.cos(a), py = cy + r * Math.sin(a);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  // 文字阴影（浅字配深影、深字配浅影，增强对比）
  ctx.shadowColor = lightText ? 'rgba(0,0,0,0.28)' : 'rgba(255,255,255,0.45)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetX = 1;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = wuxing.text;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 数字（主标，居中偏上）
  ctx.font = `bold ${size * 0.30}px "Arial", "Helvetica", sans-serif`;
  ctx.fillText(String(num), cx, cy - size * 0.07);
  // 地支（辅标，居中偏下）
  ctx.font = `bold ${size * 0.17}px "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif`;
  ctx.fillText(branch, cx, cy + size * 0.19);
  ctx.shadowColor = 'transparent';

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

// 12 个材质（按物理面映射后的数字生成）+ UV 分组
const materials = [];
for (let f = 0; f < 12; f++) {
  const num = numForFace[f];
  const spec = FACE_SPEC[num];
  materials.push(new THREE.MeshStandardMaterial({
    map: createTexture({
      num,
      branch: spec.branch,
      wuxing: WUXING[spec.wuxing],
      sanhe: SANHE[spec.sanhe],
    }),
    metalness: 0.1,
    roughness: 0.72,
    side: THREE.FrontSide,
  }));
}

// 每组 9 个顶点 (3 个三角形 × 3)
const perFace = 9;
for (let i = 0; i < 12; i++) {
  geo.addGroup(i * perFace, perFace, i);
}

const mesh = new THREE.Mesh(geo, materials);
// 清理默认 UV，让纹理完整显示（不扭曲）
// Three.js 的 DodecahedronGeometry 默认 UV 是极坐标投影，不适合贴字
// 改为每个面使用完整纹理 (UV 映射到整个面)
{
  const uvs = geo.attributes.uv;
  const array = uvs.array;
  // 每个面 9 个顶点，映射到正则五边形 UV
  const pentUV = [];
  for (let k = 0; k < 5; k++) {
    const a = -Math.PI/2 + (2 * Math.PI * k) / 5;
    pentUV.push({ u: 0.5 + 0.45 * Math.cos(a), v: 0.5 + 0.45 * Math.sin(a) });
  }

  for (let f = 0; f < 12; f++) {
    // 获取该面 5 个独立顶点 (去重)
    const verts = [];
    for (let j = 0; j < 9; j++) {
      const idx = f * 9 + j;
      const v = new THREE.Vector3(pos.getX(idx), pos.getY(idx), pos.getZ(idx));
      let dup = false;
      for (const u of verts) { if (v.distanceTo(u) < 0.001) { dup = true; break; } }
      if (!dup) verts.push(v);
    }
    // 投影到 2D 并排序
    const fc = faceCenters[f];
    const fn = faceNormals[f];
    const up = Math.abs(fn.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
    const tx = new THREE.Vector3().crossVectors(fn, up).normalize();
    const ty = new THREE.Vector3().crossVectors(fn, tx).normalize();
    const proj = verts.map(v => {
      const rel = v.clone().sub(fc);
      return { x: rel.dot(tx), y: rel.dot(ty) };
    });
    const order = verts.map((_, i) => i).sort((a, b) => Math.atan2(proj[a].y, proj[a].x) - Math.atan2(proj[b].y, proj[b].x));

    for (let j = 0; j < 9; j++) {
      const v = new THREE.Vector3(pos.getX(f*9+j), pos.getY(f*9+j), pos.getZ(f*9+j));
      let vi = -1;
      for (let m = 0; m < 5; m++) { if (v.distanceTo(verts[m]) < 0.001) { vi = m; break; } }
      if (vi >= 0) {
        const si = order.indexOf(vi);
        array[(f*9+j)*2]   = pentUV[si].u;
        array[(f*9+j)*2+1] = pentUV[si].v;
      } else {
        array[(f*9+j)*2]   = 0.5;
        array[(f*9+j)*2+1] = 0.5;
      }
    }
  }
  uvs.needsUpdate = true;
}
geo.computeVertexNormals();

scene.add(mesh);

// 微弱的阴影光晕
const glowGeo = new THREE.SphereGeometry(DICE_RADIUS * 1.35, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x000000,
  transparent: true,
  opacity: 0.02,
  side: THREE.BackSide,
});
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
// ── DOM 引用 ──
const resultChar = document.getElementById('resultChar');
const resultInfo = document.getElementById('resultInfo');
const shakeBtn = document.getElementById('shakeBtn');

// 统一显示摇骰结果：地支(五行色) + 数字/五行/三合 小标
function showResult(num) {
  const spec = FACE_SPEC[num];
  const wx = WUXING[spec.wuxing];
  resultChar.textContent = spec.branch;
  resultChar.style.color = wx.fill;
  resultInfo.textContent = `${num}　${spec.wuxing}　${SANHE[spec.sanhe].name}`;
  void resultChar.offsetWidth;
  resultChar.classList.add('show');
  resultInfo.classList.add('show');
}

scene.add(glowMesh);

// ── 初始对齐 ──
(function initAlign() {
  let bestI = 0, bestDot = -2;
  const dir = new THREE.Vector3(0, 0, 1);
  for (let i = 0; i < 12; i++) {
    const d = faceNormals[i].dot(dir);
    if (d > bestDot) { bestDot = d; bestI = i; }
  }
  const q = alignQuat(bestI);
  mesh.quaternion.copy(q);
  glowMesh.quaternion.copy(q);
  showResult(numForFace[bestI]);
})();

// ── 动画 ──
let running = false;
let animId = null;
let renderLoopId = null;

function shake() {
  if (running) return;
  running = true;
  shakeBtn.disabled = true;
  resultChar.classList.remove('show');
  resultChar.textContent = '';
  resultInfo.classList.remove('show');
  resultInfo.textContent = '';

  // 目标面
  const targetIdx = Math.floor(Math.random() * 12);
  const targetQuat = alignQuat(targetIdx);

  const startQuat = mesh.quaternion.clone();
  const spinAxis = new THREE.Vector3(
    Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
  ).normalize();
  // 整数圈：结束自旋 = 单位四元数（视觉归零），姿态直接落在目标面，无需回拽/snap
  const totalSpin = (3 + (Math.random() * 3 | 0)) * Math.PI * 2; // 3~5 整圈

  // 暂停循环渲染，让动画帧全权控制
  if (renderLoopId) cancelAnimationFrame(renderLoopId);

  const DUR = 2200;
  const t0 = performance.now();

  // ── 弹跳路径（屏幕像素 → 3D 世界坐标）──
  const vfov = camera.fov * Math.PI / 180;
  const visH = 2 * Math.tan(vfov / 2) * Math.abs(camera.position.z);
  const px2world = visH / window.innerHeight;

  const WW = window.innerWidth, WH = window.innerHeight;
  // 围绕中心小幅游走：所有点限制在半径内、相邻点限距，避免大跨度瞬移
  const radius = Math.min(WW, WH) * 0.3 * px2world;   // 游走半径（世界坐标）
  const maxStep = radius * 0.7;                        // 相邻点最大距离
  const pts = [{ x: 0, y: 0 }, { x: 0, y: 0 }];
  let prev = { x: 0, y: 0 };
  const count = 5 + (Math.random() * 3 | 0);
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const step = maxStep * (0.5 + Math.random() * 0.5);
    let nx = prev.x + Math.cos(ang) * step;
    let ny = prev.y + Math.sin(ang) * step;
    const r = Math.hypot(nx, ny);
    if (r > radius) { nx = nx / r * radius; ny = ny / r * radius; }  // 越界则拉回半径内
    pts.push({ x: nx, y: ny });
    prev = { x: nx, y: ny };
  }
  // 落点 = 游走终点（重复两个控制点让 Catmull-Rom 平滑收敛、速度归零）
  pts.push({ x: prev.x, y: prev.y }, { x: prev.x, y: prev.y });

  function lerpPt(a, b, s) { return { x: a.x + (b.x - a.x) * s, y: a.y + (b.y - a.y) * s }; }
  // 向心式 Catmull-Rom（α=0.5）：按点间距离参数化（Barry-Goldman 递推），
  // 抑制过冲与尖角自相交，轨迹更贴合控制点。端点 t=0→p1, t=1→p2 精确。
  function cr(p0, p1, p2, p3, t) {
    const A = 0.5;
    const d01 = Math.max(Math.pow(Math.hypot(p1.x - p0.x, p1.y - p0.y), A), 1e-6);
    const d12 = Math.max(Math.pow(Math.hypot(p2.x - p1.x, p2.y - p1.y), A), 1e-6);
    const d23 = Math.max(Math.pow(Math.hypot(p3.x - p2.x, p3.y - p2.y), A), 1e-6);
    const t1 = d01, t2 = d01 + d12, t3 = d01 + d12 + d23;  // t0 = 0
    const tt = t1 + (t2 - t1) * t;                          // 局部 t∈[0,1] → 参数区间 [t1,t2]
    const A1 = lerpPt(p0, p1, tt / t1);                     // (tt - t0)/(t1 - t0)
    const A2 = lerpPt(p1, p2, (tt - t1) / (t2 - t1));
    const A3 = lerpPt(p2, p3, (tt - t2) / (t3 - t2));
    const B1 = lerpPt(A1, A2, tt / t2);                     // (tt - t0)/(t2 - t0)
    const B2 = lerpPt(A2, A3, (tt - t1) / (t3 - t1));
    return lerpPt(B1, B2, (tt - t1) / (t2 - t1));
  }
  function sample(t) {
    const PC = pts.length, segs = PC - 3;
    const raw = Math.max(0, t) * segs;
    const seg = Math.min(Math.floor(raw), segs - 1);
    const f = Math.min(Math.max(0, raw - seg), 1);
    return cr(pts[seg], pts[seg+1], pts[seg+2], pts[Math.min(PC-1, seg+3)], f);
  }

  function ease(t) {
    const c1 = 1.5, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  function mixEase(t) {
    if (t < 0.65) {
      const p = t / 0.65;
      return 0.72 * (p < 0.5 ? 2*p*p : -1 + (4-2*p)*p);
    }
    const p = (t - 0.65) / 0.35;
    return 0.72 + 0.28 * ease(p);
  }

  function frame(now) {
    const el = Math.min((now - t0) / DUR, 1);
    const et = mixEase(el);

    // 位置 (3D 弹跳，不移动背景)
    const pos = sample(et);
    mesh.position.set(pos.x, pos.y, 0);
    glowMesh.position.copy(mesh.position);

    // ── 旋转：对齐 + 自旋分离 ──
    // 对齐：随真实进度推进、集中在后段完成，单调无过冲
    const alignT = Math.pow(el, 2.5);
    const aq = new THREE.Quaternion().slerpQuaternions(startQuat, targetQuat, alignT);
    // 自旋：基于真实进度 el 做单调减速（easeOutCubic），从满速持续放缓到末尾归零，
    // 不会出现"减速→反向加快"的波动；整数圈保证结束时姿态=目标面。
    const spinProg = 1 - Math.pow(1 - el, 3);
    const sq = new THREE.Quaternion().setFromAxisAngle(spinAxis, totalSpin * spinProg);
    // 先对齐再自旋 → 结束时自旋归零（整数圈），对齐到位
    mesh.quaternion.copy(sq).multiply(aq);
    glowMesh.quaternion.copy(mesh.quaternion);

    if (el < 1) {
      animId = requestAnimationFrame(frame);
    } else {
      // 滚动结束：自旋已归零、对齐已到位，姿态精确锁定为目标面，不再二次旋转。
      // 先在落点停留片刻（"停在那个面就不动了"），再纯平移到屏幕中间展示（全程不旋转）。
      mesh.quaternion.copy(targetQuat);
      glowMesh.quaternion.copy(targetQuat);
      const fromPos = mesh.position.clone();
      const ZERO = new THREE.Vector3(0, 0, 0);
      const st0 = performance.now();
      const HOLD = 140, MOVE = 480;
      function settle(now) {
        const dt = now - st0;
        if (dt < HOLD) {
          // 原地停留：姿态与位置都不变
        } else {
          const p = Math.min((dt - HOLD) / MOVE, 1);
          const ep = 1 - Math.pow(1 - p, 3);  // easeOutCubic：起步慢，自然过渡到平移
          mesh.position.lerpVectors(fromPos, ZERO, ep);
          glowMesh.position.copy(mesh.position);
          if (p >= 1) {
            mesh.position.copy(ZERO);
            glowMesh.position.copy(ZERO);
            renderer.render(scene, camera);
            done(targetIdx);
            return;
          }
        }
        renderer.render(scene, camera);
        animId = requestAnimationFrame(settle);
      }
      animId = requestAnimationFrame(settle);
    }
    renderer.render(scene, camera);
  }
  animId = requestAnimationFrame(frame);
}

function done(idx) {
  showResult(numForFace[idx]);
  running = false;
  shakeBtn.disabled = false;
  // 重启循环渲染
  function loop() { renderer.render(scene, camera); renderLoopId = requestAnimationFrame(loop); }
  renderLoopId = requestAnimationFrame(loop);
}

shakeBtn.addEventListener('click', shake);

window.addEventListener('resize', () => {
  updateCamera();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 循环渲染
(function startRenderLoop() {
  function loop() { renderer.render(scene, camera); renderLoopId = requestAnimationFrame(loop); }
  renderLoopId = requestAnimationFrame(loop);
})();

console.log('🎲 十二面骰子已加载');
</script>
</body>
</html>
